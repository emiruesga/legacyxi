databases:
  - name: legacyxi-db
    plan: free
    databaseName: legacyxi
    user: legacyxi

services:
  - type: web
    name: legacyxi-server
    runtime: node
    plan: free
    rootDir: apps/server
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: legacyxi-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: 8787
